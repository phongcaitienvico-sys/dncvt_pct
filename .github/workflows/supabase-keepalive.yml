name: Supabase Keepalive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase healthcheck
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://unbrchhbfughabmkorxt.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYnJjaGhiZnVnaGFibWtvcnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDU4NDUsImV4cCI6MjEwODYyMTg0NX0.RfnJ-prGJOgkbZdxzypTBpSpbknUK8tu6-WXWTF1Pbo' }}
    steps:
      - name: Call PostgREST rpc/healthcheck
        run: |
          SUPABASE_URL="${SUPABASE_URL%/}"
          curl -fsS -X POST "${SUPABASE_URL}/rest/v1/rpc/healthcheck" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{}"
