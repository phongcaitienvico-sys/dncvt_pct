<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In phiếu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=mvpbv1sq">
  <link rel="stylesheet" href="css/print.css?v=20261023-layout3">
  <script src="https://cdn.jsdelivr.net/npm/nunjucks@3.2.4/browser/nunjucks.min.js"></script>
  <script src="js/config.js?v=mvpbv1sq"></script>
  <script src="js/logic.js?v=mvpbv1sq"></script>
  <script src="js/vendor/supabase.min.js?v=mvpbv1sq"></script>
  <script src="js/app.js?v=mvpbv1sq"></script>
  <script src="js/print_mapping.js?v=20261023-layout3"></script>
</head>
<body class="print">
  <div class="print-toolbar">
    <button class="primary" type="button" id="btn-print">In / Lưu PDF</button>
    <label>Khổ giấy
      <select id="paper">
        <option value="a4l">A4 ngang</option>
        <option value="a5l">A5 ngang</option>
        <option value="a4p">A4 dọc</option>
        <option value="a5p">A5 dọc</option>
      </select>
    </label>
    <span class="muted small">A5 ngang: 210 × 148 mm. Muốn cột rộng hơn, chọn A4 ngang: 297 × 210 mm.</span>
    <label>Số dòng tối đa mỗi trang
      <select id="rpp"></select>
    </label>
    <span class="muted small">Nội dung dài sẽ tự chia thêm trang để giữ đủ chữ và chữ ký.</span>
    <span class="muted small">Muốn lưu file: chọn máy in "Lưu dưới dạng PDF" / "Save as PDF". Bỏ tick "Đầu trang và chân trang" để phiếu sạch.</span>
    <span class="spacer"></span>
    <a href="lines.html">← Bảng vật tư</a>
  </div>
  <div id="msg">Đang tải phiếu…</div>
  <div id="out"></div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const tpl = params.get('tpl') || 'phieu_de_nghi';
      const codes = (params.get('codes') || '').split(',').map((s) => s.trim()).filter(Boolean);
      const M = window.PRINT_MAPPING;
      const msg = document.getElementById('msg');
      if (!M[tpl] || !/^[a-z_]+$/.test(tpl)) { msg.textContent = 'Mẫu in không hợp lệ: ' + tpl; return; }
      if (!codes.length) { msg.textContent = 'Chưa có số phiếu.'; return; }
      const m = M[tpl];

      // Khổ giấy: mặc định A5 ngang; số dòng mỗi trang gợi ý theo khổ (nhớ lựa chọn trên máy này)
      const PAPERS = {
        a5l: { size: 'A5 landscape', w: '210mm', h: '148mm', pad: '6mm 7mm 8mm 7mm', fs: '9pt', gap: '9mm', logo: '10mm', cp: '0.7mm', rows: 5 },
        a4l: { size: 'A4 landscape', w: '297mm', h: '210mm', pad: '8mm 10mm 10mm 10mm', fs: '10pt', gap: '14mm', logo: '14mm', cp: '1mm', rows: 10 },
        a4p: { size: 'A4 portrait', w: '210mm', h: '297mm', pad: '10mm 10mm 12mm 12mm', fs: '11pt', gap: '20mm', logo: '20mm', cp: '1.5mm', rows: 15 },
        a5p: { size: 'A5 portrait', w: '148mm', h: '210mm', pad: '7mm 7mm 9mm 7mm', fs: '9pt', gap: '12mm', logo: '12mm', cp: '1mm', rows: 7 },
      };
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } },
      };
      const paperSel = document.getElementById('paper');
      const sel = document.getElementById('rpp');
      const paperKey = 'ncvt_paper_' + tpl;
      paperSel.value = PAPERS[store.get(paperKey)] ? store.get(paperKey) : 'a4l';
      const rppKey = () => 'ncvt_rpp_' + tpl + '_' + paperSel.value;
      const fillRpp = () => {
        const def = PAPERS[paperSel.value].rows;
        const cur = Number(store.get(rppKey())) || def;
        sel.innerHTML = '';
        [3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 20, 25, 30, 35, 40].concat([cur]).filter((v, i, a) => a.indexOf(v) === i)
          .sort((a, b) => a - b).forEach((n) => sel.add(new Option(n, n, false, n === cur)));
      };
      const pageStyle = document.createElement('style');
      document.head.appendChild(pageStyle);
      const applyPaper = () => {
        const p = PAPERS[paperSel.value];
        const root = document.documentElement.style;
        root.setProperty('--pw', p.w); root.setProperty('--ph', p.h); root.setProperty('--pad', p.pad);
        root.setProperty('--fs', p.fs); root.setProperty('--sign-gap', p.gap);
        root.setProperty('--logo-h', p.logo); root.setProperty('--cp', p.cp);
        // Lề thật do @page quyết định; .sheet ở chế độ in bỏ padding nên đặt lề ở đây
        pageStyle.textContent = '@page { size: ' + p.size + '; margin: ' + p.pad + '; }';
      };
      fillRpp(); applyPaper();

      let boot, data, src;
      try {
        boot = await App.init();
        // chờ danh mục mới nhất (song song với tải phiếu) để tên người ký đúng như vừa sửa trong Quản trị
        [data, src, boot] = await Promise.all([
          Api.call('requests.get', { codes }),
          fetch('print/' + tpl + '.html', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('Không tải được mẫu ' + tpl); return r.text(); }),
          App.bootFresh,
        ]);
      } catch (e) { msg.textContent = e.message; return; }

      const fmt = (v, format) => {
        if (v === null || v === undefined || v === '') return '';
        if (format === 'date') return Logic.fmtDate(v);
        if (format === 'num') return Logic.fmtNum(v);
        if (format === 'money') return Logic.fmtNum(v, 0);
        return v;
      };
      const get = (obj, path) => String(path || '').split('.').reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), obj);
      const val = (obj, path, format) => fmt(get(obj, path), format);
      const cell = (line, c) => (c.field === 'stt' ? line._stt : fmt(get(line, c.field), c.format));
      const chunk = (arr, n, minRows) => {
        const rows = arr.slice();
        while (minRows && rows.length < minRows) rows.push({});
        const pages = [];
        for (let i = 0; i < rows.length; i += n) pages.push(rows.slice(i, i + n));
        return pages.length ? pages : [[]];
      };
      const dateLine = (iso) => {
        const p = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        const s = p ? 'ngày ' + p[3] + ' tháng ' + p[2] + ' năm ' + p[1] : 'ngày …… tháng …… năm ……';
        return M.company.place ? M.company.place + ', ' + s : s.charAt(0).toUpperCase() + s.slice(1);
      };
      // Tiêu đề bảng 1 hoặc 2 tầng: các cột liền nhau cùng `group` gộp thành 1 ô ở tầng trên
      const buildHead = (columns) => {
        if (!columns.some((c) => c.group)) return [columns.map((c) => ({ label: c.label, colspan: 1, rowspan: 1 }))];
        const top = [];
        const bottom = [];
        columns.forEach((c, i) => {
          if (!c.group) { top.push({ label: c.label, colspan: 1, rowspan: 2 }); return; }
          if (i > 0 && columns[i - 1].group === c.group) top[top.length - 1].colspan++;
          else top.push({ label: c.group, colspan: 1, rowspan: 1 });
          bottom.push({ label: c.label, colspan: 1, rowspan: 1 });
        });
        return [top, bottom];
      };
      // Khối chữ ký: bộ riêng theo đơn vị đề nghị (signature_sets) hoặc bộ mặc định; name_from:'requester' → tên người yêu cầu
      // Tên gọi tắt → họ tên đầy đủ (name_aliases); nhiều người cách nhau dấu ; thì đổi từng người
      const aliasMap = {};
      Object.keys(M.name_aliases || {}).forEach((k) => { aliasMap[Logic.fold(k)] = M.name_aliases[k]; });
      const fullName = (v) => String(v || '').split(/\s*;\s*/).filter(Boolean).map((n) => aliasMap[Logic.fold(n)] || n).join('; ');
      // Người ký sửa trong Quản trị → Danh mục → Người ký phiếu đề nghị; chưa có danh mục đó thì dùng bộ trong print_mapping.js
      const signerSets = (() => {
        const rows = (boot.catalogs.signers || []).filter((r) => r.title);
        if (!rows.length) return null;
        const sets = new Map();
        rows.slice().sort((a, b) => (Number(a.position) || 0) - (Number(b.position) || 0) || a.id - b.id).forEach((r) => {
          const key = Logic.fold(r.unit_contains || '').trim();
          if (!sets.has(key)) sets.set(key, []);
          sets.get(key).push({ title: r.title, name: r.name || '', name_from: r.name ? null : 'requester' });
        });
        return sets;
      })();
      const signaturesFor = (unit, requester) => {
        let list;
        if (signerSets) {
          const key = Array.from(signerSets.keys()).find((k) => k && Logic.fold(unit).includes(k));
          list = signerSets.get(key !== undefined ? key : '') || [];
        } else {
          const set = (m.signature_sets || []).find((x) => Logic.fold(unit).includes(Logic.fold(x.unit_contains)));
          list = (set && set.signatures) || m.signatures || [];
        }
        return list.map((s) => Object.assign({}, s, {
          name: s.name_from === 'requester' ? fullName(requester) : (s.name || ''),
        }));
      };
      const withStt = (lines) => lines.map((l, i) => Object.assign({}, l, {
        _stt: i + 1, material_group: Logic.normalizeMaterialGroup(l.material_group, boot.catalogs.material_groups), amount: l.unit_price === null || l.unit_price === undefined ? null : Logic.amount(l),
      }));

      // Chuẩn bị dữ liệu cho từng mẫu
      const PREPARE = {
        phieu_de_nghi(n) {
          return data.map((x) => {
            const header = Object.assign({}, x.request.header_json || {});
            header.project = [header.project_code, header.project_name].filter(Boolean).join(' — ');
            return {
              request: x.request, header, pages: chunk(withStt(x.lines), n, m.min_rows),
              date_line: dateLine(header.request_date), signatures: signaturesFor(header.unit, header.requester),
            };
          });
        },
        don_dat_hang(n) {
          const bySupplier = {};
          data.forEach((x) => x.lines.forEach((l) => {
            const k = l.supplier || '(Chưa có nhà cung cấp)';
            (bySupplier[k] = bySupplier[k] || []).push(l);
          }));
          const catalog = boot.catalogs.suppliers;
          return Object.keys(bySupplier).sort((a, b) => a.localeCompare(b, 'vi')).map((k) => {
            const info = catalog.find((s) => s.code === k || s.name === k) || { name: k };
            const lines = withStt(bySupplier[k]);
            return {
              supplier: info, codes: codes.join(', '), pages: chunk(lines, n, m.min_rows),
              total: lines.reduce((s, l) => s + l.amount, 0), date_line: dateLine(boot.today),
            };
          });
        },
        phieu_ban_giao(n) {
          const rows = data.map((x, i) => {
            const h = x.request.header_json || {};
            return {
              _stt: i + 1, code: x.request.code, unit: h.unit, line_count: x.lines.length,
              project: [h.project_code, h.project_name].filter(Boolean).join(' — '),
              issued_date: String(x.request.issued_at || '').slice(0, 10),
            };
          });
          return [{ pages: chunk(rows, n, m.min_rows), date_line: dateLine(boot.today) }];
        },
      };

      const env = new nunjucks.Environment(null, { autoescape: true });
      let renderVersion = 0;
      async function render() {
        const version = ++renderVersion;
        const printButton = document.getElementById('btn-print');
        printButton.disabled = true;
        const n = Number(sel.value);
        const docs = PREPARE[tpl](n);
        const out = document.getElementById('out');
        const draw = () => {
          out.innerHTML = env.renderString(src, {
            docs, m, company: M.company, val, cell, fmt, codes, head: buildHead(m.columns || []),
          });
        };
        draw();
        await document.fonts.ready;
        await Promise.all(Array.from(out.querySelectorAll('img'), img => img.decode().catch(() => {})));
        if (version !== renderVersion) return;
        // Đo với cùng chiều rộng, font và khoảng cách như PDF. Dòng chỉ được
        // chuyển sang trang sau; không tách trang chỉ có một dòng.
        let split;
        do {
          split = false;
          const sheets = Array.from(out.querySelectorAll('.sheet'));
          let index = 0;
          for (const doc of docs) {
            for (let p = 0; p < doc.pages.length; p++) {
              const sheet = sheets[index++];
              const style = getComputedStyle(sheet);
              const top = sheet.getBoundingClientRect().top;
              const footer = sheet.querySelector('.pageno');
              const footerSpace = footer ? footer.getBoundingClientRect().height + 12 : 0;
              const limit = parseFloat(style.minHeight) - parseFloat(style.paddingBottom) - footerSpace - 2;
              const flow = Array.from(sheet.children).filter(el => el !== footer);
              const bottom = Math.max(...flow.map(el => el.getBoundingClientRect().bottom - top));
              if (bottom <= limit || doc.pages[p].length < 2) continue;
              const rows = Array.from(sheet.querySelectorAll('.items tbody tr'));
              // Khi tách, chữ ký chuyển sang trang cuối. Trang hiện tại chỉ
              // cần dành chỗ cho số trang, không giữ khoảng trống chữ ký nữa.
              const fitting = rows.filter(row => row.getBoundingClientRect().bottom - top <= limit).length;
              // Giữ tối thiểu 3 dòng cùng chữ ký nếu đủ dữ liệu, tránh một
              // trang cuối chỉ có 1 dòng khi phần chữ ký không còn vừa.
              const tail = tpl === 'phieu_de_nghi' && p === doc.pages.length - 1 && doc.pages[p].length >= 6 ? 3 : 1;
              const cut = Math.max(1, Math.min(fitting, doc.pages[p].length - tail));
              const overflow = doc.pages[p].splice(cut);
              if (doc.pages[p + 1] && overflow.length + doc.pages[p + 1].length <= n) {
                doc.pages[p + 1].unshift(...overflow);
              } else {
                doc.pages.splice(p + 1, 0, overflow);
              }
              split = true;
              break;
            }
            if (split) break;
          }
          if (split) draw();
        } while (split);
        // Giãn đều các dòng để tận dụng giấy. Trang cuối chỉ tăng tối đa 12px
        // mỗi dòng, tránh kéo một phiếu ít vật tư thành các ô quá cao.
        out.querySelectorAll('.sheet.pdn').forEach(sheet => {
          const style = getComputedStyle(sheet);
          const top = sheet.getBoundingClientRect().top;
          const footer = sheet.querySelector('.pageno');
          const footerSpace = footer ? footer.getBoundingClientRect().height + 12 : 0;
          const limit = parseFloat(style.minHeight) - parseFloat(style.paddingBottom) - footerSpace - 4;
          const flow = Array.from(sheet.children).filter(el => el !== footer);
          const bottom = Math.max(...flow.map(el => el.getBoundingClientRect().bottom - top));
          const rows = Array.from(sheet.querySelectorAll('.items tbody tr'));
          const extra = Math.min(Math.max(0, limit - bottom) / rows.length, sheet.querySelector('.signs') ? 12 : Infinity);
          const heights = rows.map(row => row.getBoundingClientRect().height);
          rows.forEach((row, i) => { row.style.height = (heights[i] + extra) + 'px'; });
        });
        msg.style.display = 'none';
        printButton.disabled = false;
      }
      const renderError = (e) => { msg.style.display = ''; msg.textContent = 'Lỗi mẫu in: ' + e.message; };
      sel.addEventListener('change', () => { store.set(rppKey(), sel.value); render().catch(renderError); });
      paperSel.addEventListener('change', () => { store.set(paperKey, paperSel.value); fillRpp(); applyPaper(); render().catch(renderError); });
      document.getElementById('btn-print').addEventListener('click', () => window.print());
      document.title = (tpl === 'phieu_de_nghi' ? '' : tpl + ' ') + codes.join('_');
      try { await render(); } catch (e) { renderError(e); }
    })();
  </script>
</body>
</html>
