<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phiếu đã xuất · Đề nghị cấp vật tư</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator_simple.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=mvlrqd4a">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="js/config.js?v=mvlrqd4a"></script>
  <script src="js/logic.js?v=mvlrqd4a"></script>
  <script src="js/app.js?v=mvlrqd4a"></script>
  <style>#grid { background: #fff; }</style>
</head>
<body>
  <header id="topbar"></header>
  <main>
    <h1>Phiếu đã xuất</h1>
    <div class="toolbar">
      <button class="primary" type="button" id="btn-open" title="Chọn nhiều phiếu để in/lưu thành 1 file PDF">Mở / In phiếu đã chọn</button>
      <button type="button" id="btn-order">Đơn đặt hàng theo NCC</button>
      <button type="button" id="btn-handover">Phiếu bàn giao</button>
      <span class="spacer"></span>
      <input type="search" id="q" placeholder="Tìm số phiếu, hạng mục, đơn vị, NCC…" style="width:280px">
      <label class="check"><input type="checkbox" id="legacy"> Hiện phiếu lịch sử (LS)</label>
      <span class="muted small" id="info"></span>
    </div>
    <div id="grid"></div>
    <div class="muted small" style="margin-top:6px">Nhấp đúp một phiếu để mở. In lại luôn ra đúng số và đầu phiếu như lúc xuất.</div>
  </main>
  <script>
    (async function () {
      await App.init();
      const fmtDT = (s) => (s ? Logic.fmtDate(s) + (s.length > 10 && s.slice(11, 16) !== '00:00' ? ' ' + s.slice(11, 16) : '') : '');
      let placeholder = 'Đang tải…';
      const table = new Tabulator('#grid', {
        height: 'max(320px, calc(100vh - 170px))', layout: 'fitData', placeholder: () => placeholder, selectableRows: 'highlight', index: 'code',
        columns: [
          { formatter: 'rowSelection', titleFormatter: 'rowSelection', titleFormatterParams: { rowRange: 'active' }, hozAlign: 'center', headerSort: false, width: 36 },
          { field: 'code', title: 'Số phiếu', width: 120, cssClass: 'code' },
          { field: 'issued_at', title: 'Ngày xuất', width: 130, formatter: (c) => fmtDT(c.getValue()) },
          { field: 'issued_by', title: 'Người xuất', width: 130 },
          { field: 'unit', title: 'Đơn vị đề xuất', width: 150 },
          { field: 'project', title: 'Hạng mục', width: 240 },
          { field: 'delivery_location', title: 'Nơi giao', width: 120 },
          { field: 'line_count', title: 'Số dòng', width: 75, hozAlign: 'right' },
          { field: 'amount', title: 'Tổng tiền', width: 120, hozAlign: 'right', formatter: (c) => Logic.fmtNum(c.getValue(), 0) },
          { field: 'suppliers', title: 'NCC', width: 160 },
        ],
      });
      await new Promise((r) => table.on('tableBuilt', r));
      let rows = [];
      try {
        rows = (await Api.call('requests.list')).map((r) => {
          const h = r.header_json || {};
          return Object.assign(r, {
            unit: h.unit, delivery_location: h.delivery_location,
            project: [h.project_code, h.project_name].filter(Boolean).join(' — '),
            _s: Logic.fold([r.code, h.unit, h.project_code, h.project_name, h.delivery_location, r.suppliers, r.issued_by].join(' ')),
          });
        });
      } catch (e) { App.toast(e.message, 'error'); }
      table.setData(rows);
      const q = document.getElementById('q');
      const legacy = document.getElementById('legacy');
      const info = () => { document.getElementById('info').textContent = table.getDataCount('active') + ' phiếu' + (table.getSelectedRows().length ? ' · chọn ' + table.getSelectedRows().length : ''); };
      const filter = () => {
        const words = Logic.fold(q.value).split(/\s+/).filter(Boolean);
        table.setFilter((d) => (legacy.checked || !d.legacy_flag) && words.every((w) => d._s.includes(w)));
        info();
      };
      q.addEventListener('input', filter);
      legacy.addEventListener('change', filter);
      table.on('rowSelectionChanged', info);
      table.on('rowDblClick', (e, row) => window.open(App.printUrl([row.getData().code]), '_blank'));
      placeholder = 'Không có phiếu nào khớp.';
      filter();

      const selected = () => {
        const codes = table.getSelectedData().map((d) => d.code);
        if (!codes.length) App.toast('Hãy tick chọn ít nhất một phiếu.', 'error');
        if (codes.length > 100) { App.toast('Tối đa 100 phiếu mỗi lần.', 'error'); return []; }
        return codes;
      };
      const open = (tpl) => { const c = selected(); if (c.length) window.open(App.printUrl(c, tpl), '_blank'); };
      document.getElementById('btn-open').onclick = () => open('phieu_de_nghi');
      document.getElementById('btn-order').onclick = () => open('don_dat_hang');
      document.getElementById('btn-handover').onclick = () => open('phieu_ban_giao');
    })();
  </script>
</body>
</html>
